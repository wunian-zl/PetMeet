
server:
  port: 8080

spring:
  application:
    name: petmeet

  # ================== 数据源配置 ==================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PETMEET_DB_URL:jdbc:mysql://localhost:3306/petmeet?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${PETMEET_DB_USER:root}
    password: ${PETMEET_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000

  # ================== Redis 配置 ==================
  data:
    redis:
      host: ${PETMEET_REDIS_HOST:localhost}
      port: ${PETMEET_REDIS_PORT:6379}
      password: ${PETMEET_REDIS_PASSWORD:}  # 无密码留空
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # ================== 文件上传限制 ==================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ================== MyBatis-Plus 配置 ==================
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描包
  type-aliases-package: org.petmeet.entity
  configuration:
    # 开启驼峰命名转换 (数据库下划线 -> Java驼峰)
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略: 自增
      id-type: auto
      # 逻辑删除字段值 (如果使用逻辑删除)
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # table-prefix: t_

# ================== Sa-Token 配置 ==================
sa-token:
  # Token 名称 (同时也是 Cookie 名称)
  token-name: Authorization
  # Token 有效期，单位秒，30天
  timeout: 2592000
  # Token 临时有效期 (指定时间内无操作就视为过期)，单位秒，-1代表不限制
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录，为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个Token (为true时所有登录共用一个Token，为false时每次登录新建一个Token)
  is-share: false
  # Token 风格 (uuid, simple-uuid, random-32, random-64, random-128, tik)
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否从header中读取token
  is-read-header: true
  # 是否从cookie中读取token
  is-read-cookie: false

# ================== Knife4j 接口文档配置 ==================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  # 扫描包路径
  packages-to-scan: org.petmeet.controller
  paths-to-match: /**

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表

# ================== 日志配置 ==================
logging:
  level:
    org.petmeet: info
    com.baomidou.mybatisplus: warn

# ================== 文件上传配置 ==================
petmeet:
  upload:
    # 默认以整个 PetMeet 工作区根目录为基准，上传目录固定为 ./uploads
    path: ${PETMEET_UPLOAD_PATH:./uploads}
    # 文件访问基础URL
    base-url: ${PETMEET_UPLOAD_BASE_URL:http://localhost:8080/images}
  dev:
    # 本地开发辅助启动开关。默认关闭，避免部署环境误拉起前端进程。
    launch-all: ${PETMEET_DEV_LAUNCH_ALL:false}
    launch-redis: ${PETMEET_DEV_LAUNCH_REDIS:true}
    launch-frontends: ${PETMEET_DEV_LAUNCH_FRONTENDS:true}
app:
  cors:
    allowed-origins: ${PETMEET_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  admin:
    username: admin
    password: ${PETMEET_ADMIN_PASSWORD:}
    nickname: admin
  order:
    pay-timeout-minutes: 30
    auto-close-cron: "0 * * * * ?"
  pay:
    alipay:
      enabled: ${PETMEET_ALIPAY_ENABLED:false}
      gateway-url: ${PETMEET_ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      app-id: ${PETMEET_ALIPAY_APP_ID:}
      private-key: ${PETMEET_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${PETMEET_ALIPAY_PUBLIC_KEY:}
      notify-url: ${PETMEET_ALIPAY_NOTIFY_URL:http://localhost:8080/api/pay/alipay/notify}
      subject-prefix: ${PETMEET_ALIPAY_SUBJECT_PREFIX:PetMeet订单}
