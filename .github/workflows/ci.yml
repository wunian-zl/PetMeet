name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            PetMeet-frontend/PetMeet-user/package-lock.json
            PetMeet-frontend/PetMeet-admin/package-lock.json

      - name: Build backend
        working-directory: PetMeet-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Build user frontend
        working-directory: PetMeet-frontend/PetMeet-user
        run: |
          npm ci
          npm run build

      - name: Build admin frontend
        working-directory: PetMeet-frontend/PetMeet-admin
        run: |
          npm ci
          npm run build
