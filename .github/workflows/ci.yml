name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            PetMeet-frontend/PetMeet-user/package-lock.json
            PetMeet-frontend/PetMeet-admin/package-lock.json

      - name: Build backend
        working-directory: PetMeet-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Build user frontend
        working-directory: PetMeet-frontend/PetMeet-user
        run: |
          npm ci
          npm run build

      - name: Build admin frontend
        working-directory: PetMeet-frontend/PetMeet-admin
        run: |
          npm ci
          npm run build

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: petmeet-backend-jar
          path: PetMeet-backend/target/*.jar
          if-no-files-found: error

      - name: Upload user frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: petmeet-user-dist
          path: PetMeet-frontend/PetMeet-user/dist
          if-no-files-found: error

      - name: Upload admin frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: petmeet-admin-dist
          path: PetMeet-frontend/PetMeet-admin/dist
          if-no-files-found: error
