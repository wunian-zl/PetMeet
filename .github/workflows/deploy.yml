name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to deploy to the production server.
        required: true
        type: string
      backend:
        description: Build and upload backend jar.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - always
          - never

concurrency:
  group: petmeet-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect backend changes
        id: backend_changes
        run: |
          set -euo pipefail

          mode="${{ inputs.backend }}"
          case "$mode" in
            always)
              build_backend=true
              reason="manual override"
              ;;
            never)
              build_backend=false
              reason="manual override"
              ;;
            auto)
              if git rev-parse HEAD^ >/dev/null 2>&1 \
                && git diff --quiet HEAD^ HEAD -- \
                  PetMeet-backend/pom.xml \
                  PetMeet-backend/mvnw \
                  PetMeet-backend/mvnw.cmd \
                  PetMeet-backend/.mvn \
                  PetMeet-backend/src; then
                build_backend=false
                reason="no backend code changes"
              else
                build_backend=true
                reason="backend code changed or previous commit unavailable"
              fi
              ;;
            *)
              echo "Unsupported backend mode: $mode"
              exit 1
              ;;
          esac

          echo "build=$build_backend" >> "$GITHUB_OUTPUT"
          echo "Backend build: $build_backend ($reason)"

      - name: Set up Java
        if: ${{ steps.backend_changes.outputs.build == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            PetMeet-frontend/PetMeet-user/package-lock.json
            PetMeet-frontend/PetMeet-admin/package-lock.json

      - name: Build backend
        if: ${{ steps.backend_changes.outputs.build == 'true' }}
        working-directory: PetMeet-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Build user frontend
        working-directory: PetMeet-frontend/PetMeet-user
        run: |
          npm ci
          npm run build

      - name: Build admin frontend
        working-directory: PetMeet-frontend/PetMeet-admin
        env:
          VITE_APP_BASE: /admin/
        run: |
          npm ci
          npm run build

      - name: Create deploy bundle
        env:
          BUILD_BACKEND: ${{ steps.backend_changes.outputs.build }}
        run: |
          set -euo pipefail

          output_dir="outputs/petmeet-deploy"

          rm -rf outputs
          mkdir -p "$output_dir/frontend" "$output_dir/uploads"

          if [ "$BUILD_BACKEND" = "true" ]; then
            jar_path="$(find PetMeet-backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort | head -n 1)"
            if [ -z "$jar_path" ]; then
              echo "Backend jar not found under PetMeet-backend/target."
              exit 1
            fi
            cp "$jar_path" "$output_dir/PetMeet-backend.jar"
          else
            echo "Skipping backend jar in deploy bundle."
          fi

          cp -R PetMeet-backend/sql "$output_dir/sql"
          cp -R deploy "$output_dir/deploy"
          cp -R uploads/demo "$output_dir/uploads/demo"
          cp -R PetMeet-frontend/PetMeet-user/dist "$output_dir/frontend/user"
          cp -R PetMeet-frontend/PetMeet-admin/dist "$output_dir/frontend/admin"

          test -d "$output_dir/frontend/user"
          test -d "$output_dir/frontend/admin"
          test -d "$output_dir/uploads/demo"

      - name: Upload deploy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: petmeet-deploy-bundle
          path: outputs/petmeet-deploy
          if-no-files-found: error
          retention-days: 7

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PETMEET_SERVER_SSH_KEY }}" > ~/.ssh/petmeet_deploy
          chmod 600 ~/.ssh/petmeet_deploy
          ssh-keyscan -H "${{ secrets.PETMEET_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload bundle to server
        run: |
          set -euo pipefail
          remote_stage="/tmp/petmeet-deploy-stage"

          ssh -i ~/.ssh/petmeet_deploy \
            -o BatchMode=yes \
            "${{ secrets.PETMEET_SERVER_USER }}@${{ secrets.PETMEET_SERVER_HOST }}" \
            "PETMEET_STAGE='$remote_stage' bash -s" <<'REMOTE'
          set -euo pipefail

          stage="$PETMEET_STAGE"
          sudo -n true

          if [ ! -d "$stage" ]; then
            mkdir -p "$stage/frontend" "$stage/uploads"

            if [ -d /var/www/petmeet/user ]; then
              mkdir -p "$stage/frontend/user"
              sudo rsync -a /var/www/petmeet/user/ "$stage/frontend/user/"
            fi
            if [ -d /var/www/petmeet/admin ]; then
              mkdir -p "$stage/frontend/admin"
              sudo rsync -a /var/www/petmeet/admin/ "$stage/frontend/admin/"
            fi
            if [ -d /opt/petmeet/sql ]; then
              mkdir -p "$stage/sql"
              sudo rsync -a /opt/petmeet/sql/ "$stage/sql/"
            fi
            if [ -d /opt/petmeet/uploads/demo ]; then
              mkdir -p "$stage/uploads/demo"
              sudo rsync -a /opt/petmeet/uploads/demo/ "$stage/uploads/demo/"
            fi
            if [ -d /opt/petmeet/deploy ]; then
              mkdir -p "$stage/deploy"
              sudo rsync -a /opt/petmeet/deploy/ "$stage/deploy/"
            fi

            sudo chown -R "$USER:$USER" "$stage"
          fi

          sudo chown -R "$USER:$USER" "$stage"
          REMOTE

          rsync -az --delete \
            -e "ssh -i ~/.ssh/petmeet_deploy -o BatchMode=yes" \
            outputs/petmeet-deploy/ \
            "${{ secrets.PETMEET_SERVER_USER }}@${{ secrets.PETMEET_SERVER_HOST }}:${remote_stage}/"

      - name: Deploy on server
        run: |
          set -euo pipefail
          remote_stage="/tmp/petmeet-deploy-stage"

          ssh -i ~/.ssh/petmeet_deploy \
            -o BatchMode=yes \
            "${{ secrets.PETMEET_SERVER_USER }}@${{ secrets.PETMEET_SERVER_HOST }}" \
            "PETMEET_RELEASE='$remote_stage' PETMEET_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          release_dir="$PETMEET_RELEASE"
          run_id="$PETMEET_RUN_ID"
          backup_dir="/opt/petmeet/backups/$(date +%Y%m%d%H%M%S)-${run_id}"

          rollback() {
            set +e
            trap - ERR
            echo "Deployment failed. Rolling back from ${backup_dir}."

            if [ -f "${backup_dir}/PetMeet-backend.jar" ]; then
              sudo cp "${backup_dir}/PetMeet-backend.jar" /opt/petmeet/PetMeet-backend.jar
            fi
            if [ -d "${backup_dir}/frontend/user" ]; then
              sudo rsync -a --delete "${backup_dir}/frontend/user/" /var/www/petmeet/user/
            fi
            if [ -d "${backup_dir}/frontend/admin" ]; then
              sudo rsync -a --delete "${backup_dir}/frontend/admin/" /var/www/petmeet/admin/
            fi
            if [ -d "${backup_dir}/sql" ]; then
              sudo rm -rf /opt/petmeet/sql
              sudo cp -R "${backup_dir}/sql" /opt/petmeet/sql
            fi
            if [ -d "${backup_dir}/uploads/demo" ]; then
              sudo rsync -a --delete "${backup_dir}/uploads/demo/" /opt/petmeet/uploads/demo/
            fi

            sudo chown -R petmeet:petmeet /opt/petmeet
            sudo systemctl restart petmeet-backend
            exit 1
          }

          sudo -n true

          test -d "$release_dir/frontend/user"
          test -d "$release_dir/frontend/admin"
          test -d "$release_dir/deploy"
          test -d "$release_dir/sql"
          test -d "$release_dir/uploads/demo"

          backend_changed=0
          if [ -f "$release_dir/PetMeet-backend.jar" ]; then
            backend_changed=1
          fi

          sudo mkdir -p "$backup_dir/frontend" "$backup_dir/uploads"
          if [ -f /opt/petmeet/PetMeet-backend.jar ]; then
            sudo cp /opt/petmeet/PetMeet-backend.jar "$backup_dir/PetMeet-backend.jar"
          fi
          if [ -d /var/www/petmeet/user ]; then
            sudo rsync -a /var/www/petmeet/user/ "$backup_dir/frontend/user/"
          fi
          if [ -d /var/www/petmeet/admin ]; then
            sudo rsync -a /var/www/petmeet/admin/ "$backup_dir/frontend/admin/"
          fi
          if [ -d /opt/petmeet/sql ]; then
            sudo cp -R /opt/petmeet/sql "$backup_dir/sql"
          fi
          if [ -d /opt/petmeet/uploads/demo ]; then
            sudo rsync -a /opt/petmeet/uploads/demo/ "$backup_dir/uploads/demo/"
          fi

          trap rollback ERR

          if [ "$backend_changed" = "1" ]; then
            sudo cp "$release_dir/PetMeet-backend.jar" /opt/petmeet/PetMeet-backend.jar
          else
            echo "No backend jar in release; keeping existing backend."
          fi
          sudo rm -rf /opt/petmeet/sql
          sudo cp -R "$release_dir/sql" /opt/petmeet/sql

          sudo mkdir -p /opt/petmeet/uploads/demo /var/www/petmeet/user /var/www/petmeet/admin
          sudo rsync -a --delete "$release_dir/uploads/demo/" /opt/petmeet/uploads/demo/
          sudo rsync -a --delete "$release_dir/frontend/user/" /var/www/petmeet/user/
          sudo rsync -a --delete "$release_dir/frontend/admin/" /var/www/petmeet/admin/
          sudo chown -R petmeet:petmeet /opt/petmeet

          if [ "$backend_changed" = "1" ]; then
            sudo systemctl restart petmeet-backend
          fi

          backend_ready=0
          for i in $(seq 1 45); do
            if sudo systemctl is-active --quiet petmeet-backend \
              && (curl -fsS --max-time 5 http://127.0.0.1:8080/doc.html >/dev/null 2>&1 \
                || curl -fsS --max-time 5 http://127.0.0.1:8080/v3/api-docs >/dev/null 2>&1); then
              backend_ready=1
              break
            fi
            sleep 2
          done
          test "$backend_ready" = "1"

          frontend_ready=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://127.0.0.1/ >/dev/null 2>&1; then
              frontend_ready=1
              break
            fi
            sleep 2
          done
          test "$frontend_ready" = "1"

          trap - ERR
          echo "Deployment succeeded. Backup kept at ${backup_dir}."
          REMOTE
